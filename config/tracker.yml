# stage: 플라이휠 탭의 밸류체인 단계 (원부자재 → ODM → 브랜드사 → 유통 → 채널). 비우면 밸류체인에서 제외.
# fs: 재무 기준 (연결 우선, 연결재무제표가 없는 회사는 별도) — 수집기가 자동으로 고르고 화면에 표시
companies:
  # 원/부자재
