# K뷰티 트래커 설정. 종목·코드·키워드는 여기서만 바꾼다. 바꾼 뒤 커밋하면 다음 빌드에 반영.

backfill_start: "202101"        # 5개년 백필 시작 월 (DART·주가·위키 등)
long_backfill_start: "201901"   # 관세청·환율은 기존 트래커와 같은 2019-01부터 (합치기 전 기존 쪽 기간이 더 길었음)

