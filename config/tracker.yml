  categories:
    뷰티 전체: "https://www.amazon.com/gp/bestsellers/beauty"
    스킨케어: "https://www.amazon.com/Best-Sellers-Beauty-Personal-Care-Skin-Care-Products/zgbs/beauty/11060451"
    선케어: "https://www.amazon.com/Best-Sellers-Beauty-Personal-Care-Sunscreens/zgbs/beauty/11062651"
    # 여드름 패치는 아마존 US에 전용 베스트셀러 카테고리가 없다(2026-09 확인: Mighty Patch의 최하위 분류가
    # 'Facial Treatments & Masks'). 이 카테고리를 받아 제품명으로 패치 제품을 골라 센다(amazon.patch_pattern).
    페이셜 트리트먼트: "https://www.amazon.com/gp/bestsellers/beauty/11062031"
  patch_pattern: "patch|pimple|hydrocolloid|blemish (?:sticker|dot)|spot (?:dot|cover)"
  uv_filter_date: "2026-08-01"   # 비모트리졸(UV 필터) FDA 승인 기준선 — 날짜는 확인 후 수정

