# ── 관세청 품목·국가별 수출 ───────────────────────────────────────
customs:
  # API는 요청한 코드의 '한 단계 아래' 하위 코드(4→6자리, 6→10자리)를 돌려준다.
  # store: children = 하위 코드별로 저장(세부 분석용) / total = 합계만 저장. weight: 중량도 저장(수출단가용)
  queries:
    "3304":   {store: children, weight: true}    # → 3304.10·20·30·91·99
    "330499": {store: children, weight: true}    # → 3304.99-1000 기초·-2000 메이크업·-3000 어린이·-9000 기타
    "3305":   {store: total, weight: false}
    "3307":   {store: total, weight: false}
    "9018":   {store: children, weight: false}   # → 9018.11…9018.90 (9018.90은 기존 트래커 시리즈)
    "300510": {store: children, weight: false}   # → 3005.10-1000 반창고·-9000 기타
    "300249": {store: total, weight: false}      # 보툴리눔 톡신 등 (기존 트래커에서 이관)
    "300490": {store: total, weight: false}      # 기타 의약품 (기존 트래커에서 이관)
  # 화면 표시 이름 (위 저장 결과에서 합산해 만들 수 있는 코드)
  hs:
    "3304": 화장품 전체(3304)
    "330410": 입술화장용(3304.10)
    "330420": 눈화장용(3304.20)
    "330430": 매니큐어·페디큐어(3304.30)
    "330491": 파우더(3304.91)
    "330499": 기타 기초·메이크업(3304.99)
    "3304991000": 기초화장용(3304.99-1000)
    "3304992000": 메이크업용(3304.99-2000)
    "3304993000": 어린이용(3304.99-3000)
    "3304999000": 기타(3304.99-9000)
    "3305": 두발용(3305)
    "3307": 면도·향·기타(3307)
    "9018": 의료기기(9018)
    "901890": 기타 의료기기(9018.90)
    "300510": 접착성 드레싱(3005.10, 여드름 패치 대용)
    "3005101000": 반창고(3005.10-1000)
    "3005109000": 기타 드레싱(3005.10-9000)
    "300249": 보툴리눔 톡신 등(3002.49)
    "300490": 기타 의약품(3004.90)
  # 국가 묶음: 그래프·카드에서 쓰는 이름. 코드는 관세청 ISO 2자리
  regions:
    미국: [US]
    중국: [CN]
    일본: [JP]
    홍콩: [HK]
    유럽: [GB, DE, FR, NL, PL, ES, IT, BE, SE, CZ, AT, DK, IE, PT, HU, RO, FI, GR, SK, BG, HR, SI, LT, LV, EE, LU, "NO", CH, CY, MT]
    동남아: [VN, TH, ID, MY, PH, SG]
    러시아·CIS: [RU, KZ, KG, UZ, TJ, TM, BY, AZ, AM, MD]
    중동: [AE, SA, KW, QA, OM, BH, IL, JO, TR, IQ, LB, EG]
    중남미: [BR, MX, CL, CO, PE, AR, EC, UY, PY, BO, VE, GT, PA, CR, DO, SV, HN, NI, PR]
  focus_countries: [US, CN, JP, GB, DE, FR, NL, PL, ES, IT, AE, SA, BR, MX]

